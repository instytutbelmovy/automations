AWSTemplateFormatVersion: '2010-09-09'
Description: 'Corpus Build Lambda Function and CodeBuild Project Stack'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment (dev or prod)
  
  InputBucket:
    Type: String
    Description: S3 bucket with .vert files
    Default: instytutbelmovy-vert-dev

Conditions:
  # Толькі prod разгортваецца на Hetzner VPS
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # ECR Repository для noske image (той, што круціцца на Hetzner VPS)
  NoskeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'instytutbelmovy-noske-${Environment}'
      ImageTagMutability: MUTABLE
      # Без гэтага delete-stack валіцца ў DELETE_FAILED, калі ў рэпазыторыі ляжаць image. Іх не шкада - яны перазьбіраюцца з нуля кожную ноч.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Пакідаем толькі 2 апошнія image (бягучы + для адкату)",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # IAM Role для Lambda
  CorpusBuildLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucket}"
                  - !Sub "arn:aws:s3:::${InputBucket}/*"
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:ListBuildsForProject
                Resource: "*"
        - PolicyName: EventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:DescribeEventBus
                  - events:ListRules
                Resource: "*"
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  # IAM Role для CodeBuild
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: CodeBuildLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GetAuthorizationToken не падтрымлівае абмежаваньне па рэсурсе
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt NoskeRepository.Arn

  # IAM карыстальнік для Hetzner VPS: толькі чытаньне noske рэпазыторыя.
  # Ня можа нічога іншага ў AWS - ні S3, ні Lambda, ні іншых ECR рэпазыторыяў.
  # Access key ствараецца ўручную (aws iam create-access-key)
  VpsPullerUser:
    Type: AWS::IAM::User
    Condition: IsProd
    Properties:
      UserName: !Sub '${AWS::StackName}-vps-puller'
      Policies:
        - PolicyName: ECRPullNoskeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:DescribeImages
                Resource: !GetAtt NoskeRepository.Arn

  # CodeBuild Project
  CorpusBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn: CodeBuildLogGroup
    Properties:
      Name: !Sub '${AWS::StackName}'
      Description: "Build corpus Docker image"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:4.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
            Type: PLAINTEXT
          - Name: ECR_REGISTRY
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
            Type: PLAINTEXT
          - Name: ECR_REPOSITORY
            Value: !Sub 'instytutbelmovy-noske-${Environment}'
            Type: PLAINTEXT
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          
          phases:
            install:
              runtime-versions:
                docker: 20
                nodejs: 18
              commands:
                - echo "Усталёўваем залежнасьці..."
                - yum update -y
                - yum install -y git
          
            pre_build:
              commands:
                - echo "Падрыхтоўка да зборкі..."
                - "echo \"Асяроддзе: $ENVIRONMENT\""
                - if [ "$ENVIRONMENT" = "dev" ]; then INPUT_BUCKET="instytutbelmovy-vert-dev"; IMAGE_NAME="noske-dev"; else INPUT_BUCKET="instytutbelmovy-vert"; IMAGE_NAME="noske"; fi
                - "echo \"Input Bucket: $INPUT_BUCKET\""
                - "echo \"Image Name: $IMAGE_NAME\""
          
            build:
              commands:
                - echo "Пачынаем зборку..."
                - echo "Сьцягваем NoSketch Engine рэпазыторый..."
                - "git clone --depth 1 https://github.com/alpha-mouse/NoSketch-Engine-Docker.git -b ibm-build noske"
                - mkdir -p noske/corpora
                - echo "Сьцягваем файлы з S3..."
                - "aws s3 sync s3://$INPUT_BUCKET/concatenated noske/corpora"
                - echo "Зьбіраем Docker image..."
                - cd noske
                - "docker build -t $IMAGE_NAME:latest ."
                - echo "Аўтарызуемся ў ECR..."
                - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
                # BUILD_TIMESTAMP - гэта ISO-8601 з ':' і '+', якія недапушчальныя ў Docker тэгу
                # printf, а ня echo: інакш tr ператварае канцавы \n у лішні '-'
                - IMAGE_TAG=$(printf '%s' "${BUILD_TIMESTAMP:-$CODEBUILD_BUILD_NUMBER}" | tr -c 'A-Za-z0-9._-' '-')
                - "echo \"Image tag: $IMAGE_TAG\""
                - "docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest"
                - "docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
                - echo "Пушым image..."
                # Спачатку нязьменны тэг, потым latest - каб пры збоі latest не паказваў на недапампаваны маніфэст
                - docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                - docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
                - echo "Docker image паспяхова запушаны ў ECR!"
          
          artifacts:
            discard-paths: no
      Cache:
        Type: NO_CACHE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${AWS::StackName}"
          StreamName: build-log

  # CloudWatch Log Group для CodeBuild з retention 90 дзён
  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 90

  # CloudWatch Log Group для Lambda з retention 90 дзён
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-function"
      RetentionInDays: 90

  # Lambda Function
  CorpusBuildFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-function'
      Role: !GetAtt CorpusBuildLambdaRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/instytutbelmovy-corpus-build-${Environment}:latest"
      Timeout: 300  # 5 хвілін (толькі для запуску CodeBuild)
      MemorySize: 512  # 512MB (дастаткова для запуску CodeBuild)
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          INPUT_BUCKET: !Ref InputBucket
          LOG_LEVEL: INFO

  # EventBridge Rule для запуску а 4:43 штоночы
  CorpusBuildRule:
    Type: AWS::Events::Rule
    DependsOn: CorpusBuildFunction
    Properties:
      Name: !Sub '${AWS::StackName}-trigger'
      Description: "Trigger corpus build daily at 4:43 AM UTC"
      ScheduleExpression: "cron(43 4 * * ? *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt CorpusBuildFunction.Arn
          Id: CorpusBuildTarget

  # Permission для EventBridge
  CorpusBuildPermission:
    Type: AWS::Lambda::Permission
    DependsOn: CorpusBuildRule
    Properties:
      FunctionName: !Ref CorpusBuildFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CorpusBuildRule.Arn



Outputs:
  FunctionName:
    Description: 'Назва Lambda функцыі'
    Value: !Ref CorpusBuildFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'
  
  FunctionArn:
    Description: 'ARN Lambda функцыі'
    Value: !GetAtt CorpusBuildFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  NoskeRepositoryUri:
    Description: 'URI ECR рэпазыторыя з noske image (для docker-compose на VPS)'
    Value: !GetAtt NoskeRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-NoskeRepositoryUri'

  VpsPullerUserName:
    Condition: IsProd
    Description: 'IAM карыстальнік для VPS. Ключ: aws iam create-access-key --user-name <гэтае значэньне>'
    Value: !Ref VpsPullerUser